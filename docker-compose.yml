name: similar-products

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Drop connections of clients that vanished (a killed container) after ~90 s instead of the
    # kernel's 2 h: otherwise their open transactions keep row locks and block the next jobs.
    command:
      - postgres
      - -c
      - tcp_keepalives_idle=60
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-products}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-products}
      POSTGRES_DB: ${POSTGRES_DB:-products}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    healthcheck:
      # the image has no curl/wget; bash's /dev/tcp is enough to see the HTTP port is up
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Always the compose network services, regardless of hosts in .env.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # tree (default) prints span trees to the logs; otlp sends them to Jaeger (profile observability)
      TRACING_EXPORTER: ${TRACING_EXPORTER:-tree}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build: .
    # SimpleWorker: jobs run in the worker process, so the embedding model loads once per worker
    command:
      - rq
      - worker
      - ingest
      - --url=redis://redis:6379/0
      - --with-scheduler
      - --worker-class=rq.worker.SimpleWorker
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      TRACING_EXPORTER: ${TRACING_EXPORTER:-tree}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # 2 replicas share the CPUs instead of each spinning up a thread per core
      OMP_NUM_THREADS: 4
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Warm shutdown finishes the current batch (~20-35 s) instead of being killed after 10 s.
    stop_grace_period: 2m
    deploy:
      replicas: 2

  # Optional: `docker compose --profile observability up -d` + TRACING_EXPORTER=otlp in .env
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"

volumes:
  pgdata:
  qdrant:
  # the embedding model, downloaded once on first use
  hf_cache:
