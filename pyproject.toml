[project]
name = "similar-products"
version = "0.1.0"
description = "Similar product search over Open Food Facts: Qdrant vs pgvector, filters by allergens, Nutri-Score, vegan"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "httpx>=0.27",
    "pyarrow>=17",
    "huggingface-hub>=0.26",
    "rq>=2.0",
    "psycopg[binary]>=3.2",
    "sentence-transformers>=3.0",
    "torch>=2.14.0",
    "qdrant-client>=1.12",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.26",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# local (in-memory) Qdrant ignores payload indexes; the server builds them
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

# CPU-only torch in the Linux image: the default PyPI wheel drags in ~3 GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
