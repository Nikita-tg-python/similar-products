apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: similar-products
spec:
  selector: {app: qdrant}
  ports:
    - {name: http, port: 6333}
    - {name: grpc, port: 6334}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: similar-products
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: {app: qdrant}
  template:
    metadata:
      labels: {app: qdrant}
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.1
          ports:
            - containerPort: 6333
            - containerPort: 6334
          readinessProbe:
            httpGet: {path: /readyz, port: 6333}
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: storage, mountPath: /qdrant/storage}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
