# kind create cluster --config kind-config.yaml
# One node. The api Service is a NodePort (30800), mapped to localhost:8800, so the API is reachable
# without `kubectl port-forward` too (8800, not 8000: docker compose may already hold 8000).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: similar-products
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30800
        hostPort: 8800
        listenAddress: 127.0.0.1
        protocol: TCP
